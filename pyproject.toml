[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-ocr"
version = "0.1.0"
description = "Pipeline for Recognition, Interpretation, and Structured Markup"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "pdf2image>=1.16",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "requests>=2.31",
    "rich>=13.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3",
    "paddleocr>=2.7",
    "paddlepaddle>=2.5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
prism = "prism.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]
